# Continuous verification for the committed build artifacts.
#
# dist/client.js and dist/index.js are committed (git/tarball installs must stay
# build-free), so CI first proves they still match src/**/*.ts, then type-checks
# and runs the test suite.
name: verify

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node >= 22.18 runs the TypeScript sources directly (native type
          # stripping) for scripts/build.ts and the tests/*.test.ts files.
          node-version: '22'
      # No lockfile is committed; the devDeps are esbuild, typescript and @types/node.
      - run: npm install --no-audit --no-fund
      # Must run before any build: it compares the committed artifacts to the sources.
      - run: npm run check
      - run: npm run typecheck
      - run: npm test
