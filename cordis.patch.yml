# @lsdt45-dal/dsh-workspace-plus bundle patch.
# wiring identifiers dsh.betterWorkspace persistence / settings namespace are
# retained so existing browser state migrates transparently.
#
# Manual mount equivalent (profile cordis.patch.yml):
#
#   - insert:
#       - id: workspace-plus
#         name: '@lsdt45-dal/dsh-workspace-plus'
#
# Only the Node half loads through this row; the web client half is served
# through the package's exports["./client"] entry and mounted by the browser
# boot graph (window.__DSH_BOOT__).
#
# `name` is the module specifier the profile resolves through Node module
# resolution from the profile directory, so it must equal package.json `name`
# exactly, scope included. Quoted because `@` is a reserved YAML indicator and
# cannot open a plain scalar.
- insert:
    - id: workspace-plus
      name: '@lsdt45-dal/dsh-workspace-plus'
